<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Real-world data cohort visual</title>
  <desc id="desc">Real-world data network and cohort selection visualization.</desc>
  <rect width="1200" height="675" fill="#f2f8f9"/>
  <rect x="90" y="70" width="1020" height="535" rx="12" fill="#ffffff" stroke="#cad7dc"/>
  <g stroke="#9aa6b8" stroke-width="4">
    <line x1="300" y1="220" x2="480" y2="310"/>
    <line x1="480" y1="310" x2="670" y2="210"/>
    <line x1="480" y1="310" x2="720" y2="405"/>
    <line x1="720" y1="405" x2="900" y2="275"/>
    <line x1="670" y1="210" x2="900" y2="275"/>
  </g>
  <g fill="#287c8e">
    <circle cx="300" cy="220" r="48"/>
    <circle cx="480" cy="310" r="58"/>
    <circle cx="670" cy="210" r="48"/>
    <circle cx="720" cy="405" r="52"/>
    <circle cx="900" cy="275" r="48"/>
  </g>
  <g fill="#ffffff" font-family="Arial, sans-serif" font-weight="700">
    <text x="274" y="229" font-size="24">EHR</text>
    <text x="447" y="319" font-size="24">RWD</text>
    <text x="639" y="219" font-size="24">Labs</text>
    <text x="688" y="414" font-size="24">Claims</text>
    <text x="870" y="284" font-size="24">Rx</text>
  </g>
  <text x="160" y="575" fill="#102033" font-family="Arial, sans-serif" font-size="32" font-weight="700">Real-World Data Studies</text>
</svg>
