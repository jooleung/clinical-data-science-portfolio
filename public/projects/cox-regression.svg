<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Cox regression forest plot visual</title>
  <desc id="desc">Forest plot style visualization for Cox regression hazard ratios.</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="95" y="70" width="1010" height="535" rx="10" fill="#f7f7fb" stroke="#d7dce7"/>
  <line x1="650" y1="140" x2="650" y2="500" stroke="#287c8e" stroke-width="4"/>
  <g stroke="#4c5874" stroke-width="5">
    <line x1="470" y1="190" x2="725" y2="190"/>
    <line x1="590" y1="260" x2="840" y2="260"/>
    <line x1="405" y1="330" x2="620" y2="330"/>
    <line x1="690" y1="400" x2="930" y2="400"/>
    <line x1="520" y1="470" x2="780" y2="470"/>
  </g>
  <g fill="#2f8f6b">
    <circle cx="590" cy="190" r="14"/>
    <circle cx="705" cy="260" r="14"/>
    <circle cx="515" cy="330" r="14"/>
    <circle cx="810" cy="400" r="14"/>
    <circle cx="650" cy="470" r="14"/>
  </g>
  <g fill="#102033" font-family="Arial, sans-serif">
    <text x="160" y="195" font-size="22">Treatment</text>
    <text x="160" y="265" font-size="22">Stage</text>
    <text x="160" y="335" font-size="22">Age</text>
    <text x="160" y="405" font-size="22">Biomarker</text>
    <text x="160" y="475" font-size="22">Baseline risk</text>
    <text x="160" y="625" font-size="32" font-weight="700">Cox Regression</text>
  </g>
</svg>
