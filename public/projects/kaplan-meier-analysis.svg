<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Kaplan-Meier analysis visual</title>
  <desc id="desc">Kaplan-Meier curve with risk table rows.</desc>
  <rect width="1200" height="675" fill="#f2f8f9"/>
  <rect x="90" y="70" width="1020" height="535" rx="10" fill="#ffffff" stroke="#cad7dc"/>
  <line x1="160" y1="415" x2="1015" y2="415" stroke="#9aa6b8" stroke-width="3"/>
  <line x1="160" y1="415" x2="160" y2="135" stroke="#9aa6b8" stroke-width="3"/>
  <path d="M160 160 H250 V190 H350 V225 H460 V260 H560 V305 H680 V345 H810 V385 H980" fill="none" stroke="#1f6675" stroke-width="8"/>
  <path d="M160 180 H235 V220 H325 V250 H430 V300 H540 V335 H660 V370 H790 V397 H980" fill="none" stroke="#4c5874" stroke-width="8"/>
  <rect x="160" y="465" width="820" height="74" rx="6" fill="#f7f7fb" stroke="#d7dce7"/>
  <g fill="#102033" font-family="Arial, sans-serif">
    <text x="180" y="510" font-size="20">At risk: 120   104   86   61   42   25</text>
    <text x="160" y="625" font-size="32" font-weight="700">Kaplan-Meier Analysis</text>
